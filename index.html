<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pair Picker</title>
<style>
  :root {
    --bg1: #6a5cff;
    --bg2: #ff5ca8;
    --card: #ffffff;
    --ink: #21203a;
    --muted: #6b6884;
    --accent: #ff5ca8;
    --accent2: #6a5cff;
    --chip: #f1eefe;
    --good: #22c55e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    text-align: center;
    color: #fff;
    font-size: 2rem;
    margin: 8px 0 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.9);
    margin: 0 0 24px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    margin-bottom: 20px;
  }

  .card h2 {
    margin: 0 0 14px;
    font-size: 1.1rem;
  }

  .add-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #e5e2f7;
    font-size: 1rem;
    outline: none;
    min-width: 0;
    font-family: inherit;
    resize: vertical;
    min-height: 46px;
  }

  textarea:focus {
    border-color: var(--accent2);
  }

  .add-hint {
    color: var(--muted);
    font-size: 0.82rem;
    margin: 6px 0 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    font-weight: 600;
  }

  .btn-add {
    background: var(--accent2);
    color: #fff;
    padding: 0 20px;
    font-size: 1rem;
  }

  .btn-add:active { transform: scale(0.97); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .chip {
    background: var(--chip);
    color: var(--ink);
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.92rem;
  }

  .chip button {
    background: none;
    color: var(--muted);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    line-height: 1;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .chip button:hover { background: #e2ddfb; color: var(--ink); }

  .empty-hint {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 8px;
  }

  .draw-card {
    text-align: center;
  }

  .count-line {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .count-line strong { color: var(--ink); }

  .slots {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    min-height: 76px;
    margin-bottom: 18px;
  }

  .slot {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 16px 18px;
    border-radius: 14px;
    min-width: 110px;
    box-shadow: 0 8px 18px rgba(106,92,255,0.35);
  }

  .slot.spinning {
    animation: pulse 0.12s linear infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .slot.landed {
    animation: land 0.4s ease;
  }

  @keyframes land {
    0% { transform: scale(1.25) rotate(-3deg); }
    60% { transform: scale(0.95) rotate(2deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .btn-draw {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 1.15rem;
    padding: 16px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(255,92,168,0.4);
  }

  .btn-draw:disabled {
    background: #cfcbe6;
    box-shadow: none;
    cursor: not-allowed;
  }

  .btn-draw:not(:disabled):active { transform: scale(0.97); }

  .pairs-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pairs-list li {
    background: var(--chip);
    border-left: 5px solid var(--good);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 1rem;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .pairs-list .num {
    color: var(--muted);
    font-weight: 700;
    font-size: 0.85rem;
  }

  .footer-actions {
    display: flex;
    justify-content: center;
    margin-top: 8px;
  }

  .btn-reset {
    background: transparent;
    color: rgba(255,255,255,0.85);
    text-decoration: underline;
    font-size: 0.9rem;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Pair Picker</h1>
  <p class="subtitle">Add your students, then draw one pair at a time for the next test.</p>

  <div class="card">
    <h2>Students</h2>
    <div class="add-row">
      <textarea id="nameInput" rows="3" placeholder="Type a name, or paste a whole list (one name per line)"></textarea>
      <button class="btn-add" id="addBtn">Add</button>
    </div>
    <p class="add-hint">Tip: paste a whole class list at once, one name per line. Press Ctrl+Enter (Cmd+Enter on Mac) to add without clicking.</p>
    <div class="chips" id="chips"></div>
    <p class="empty-hint" id="emptyHint">No students added yet.</p>
  </div>

  <div class="card draw-card">
    <h2>Draw</h2>
    <p class="count-line" id="countLine"><strong>0</strong> students left to pair</p>
    <div class="slots" id="slots"></div>
    <button class="btn-draw" id="drawBtn" disabled>Draw next pair</button>
  </div>

  <div class="card" id="pairsCard" style="display:none;">
    <h2>Pairs so far</h2>
    <ul class="pairs-list" id="pairsList"></ul>
  </div>

  <div class="footer-actions">
    <button class="btn-reset" id="resetBtn">Start over</button>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'pairPickerState.v1';

  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const chipsEl = document.getElementById('chips');
  const emptyHint = document.getElementById('emptyHint');
  const countLine = document.getElementById('countLine');
  const slotsEl = document.getElementById('slots');
  const drawBtn = document.getElementById('drawBtn');
  const pairsCard = document.getElementById('pairsCard');
  const pairsList = document.getElementById('pairsList');
  const resetBtn = document.getElementById('resetBtn');

  let state = loadState() || { remaining: [], pairs: [] };
  let spinning = false;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed.remaining) || !Array.isArray(parsed.pairs)) return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* ignore */
    }
  }

  function render() {
    chipsEl.innerHTML = '';
    state.remaining.forEach((name, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = name;
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Remove ' + name);
      removeBtn.addEventListener('click', () => {
        state.remaining.splice(i, 1);
        saveState();
        render();
      });
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      chipsEl.appendChild(chip);
    });

    emptyHint.style.display = state.remaining.length === 0 ? 'block' : 'none';
    countLine.innerHTML = '<strong>' + state.remaining.length + '</strong> student' +
      (state.remaining.length === 1 ? '' : 's') + ' left to pair';

    drawBtn.disabled = spinning || state.remaining.length < 2;

    pairsCard.style.display = state.pairs.length ? 'block' : 'none';
    pairsList.innerHTML = '';
    state.pairs.forEach((pair, i) => {
      const li = document.createElement('li');
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = '#' + (i + 1);
      const text = document.createElement('span');
      text.textContent = pair.join(' & ');
      li.appendChild(num);
      li.appendChild(text);
      pairsList.appendChild(li);
    });
  }

  function addNames() {
    const lines = nameInput.value
      .split(/\r?\n/)
      .map(s => s.trim())
      .filter(s => s.length > 0);
    if (!lines.length) return;

    const existingLower = new Set(state.remaining.map(n => n.toLowerCase()));
    lines.forEach(name => {
      const key = name.toLowerCase();
      if (existingLower.has(key)) return;
      existingLower.add(key);
      state.remaining.push(name);
    });

    nameInput.value = '';
    nameInput.focus();
    saveState();
    render();
  }

  addBtn.addEventListener('click', addNames);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      addNames();
    }
  });

  function pickGroupSize() {
    // Keep pairing off 2 at a time; the final leftover of 3 becomes a trio
    // so nobody is ever left alone.
    return state.remaining.length === 3 ? 3 : 2;
  }

  function drawPair() {
    if (spinning || state.remaining.length < 2) return;
    spinning = true;
    drawBtn.disabled = true;

    const groupSize = pickGroupSize();

    slotsEl.innerHTML = '';
    const slotBoxes = [];
    for (let i = 0; i < groupSize; i++) {
      const box = document.createElement('div');
      box.className = 'slot spinning';
      box.textContent = '?';
      slotsEl.appendChild(box);
      slotBoxes.push(box);
    }

    const pool = state.remaining;
    let ticks = 0;
    const maxTicks = 14;

    const interval = setInterval(() => {
      slotBoxes.forEach(box => {
        box.textContent = pool[Math.floor(Math.random() * pool.length)];
      });
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(interval);
        finishDraw(groupSize, slotBoxes);
      }
    }, 90);
  }

  function finishDraw(groupSize, slotBoxes) {
    const shuffled = [...state.remaining].sort(() => Math.random() - 0.5);
    const chosen = shuffled.slice(0, groupSize);

    chosen.forEach(name => {
      const idx = state.remaining.indexOf(name);
      if (idx !== -1) state.remaining.splice(idx, 1);
    });

    slotBoxes.forEach((box, i) => {
      box.classList.remove('spinning');
      box.classList.add('landed');
      box.textContent = chosen[i];
    });

    state.pairs.push(chosen);
    spinning = false;
    saveState();
    render();
  }

  drawBtn.addEventListener('click', drawPair);

  resetBtn.addEventListener('click', () => {
    if (!confirm('Clear all students and pairs and start over?')) return;
    state = { remaining: [], pairs: [] };
    slotsEl.innerHTML = '';
    saveState();
    render();
  });

  render();
})();
</script>
</body>
</html>
